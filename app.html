<style>
html, body { height: 100%; }
body { overflow: hidden; background: var(--bg); }

.cand { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); width: 100%; text-align: left; }
.cand.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }

.lvl { font: 700 13px var(--f-score); background: var(--brand-deep); color: var(--ball); border-radius: 8px; padding: 4px 7px; }
.timer { border-radius: 26px; padding: 22px 18px; text-align: center; color: #fff; background: var(--brand-deep); transition: background .4s; }
.timer.late { background: var(--ball); color: var(--ball-ink); }
.timer .big { font: 700 64px/1 var(--f-score); letter-spacing: -.02em; margin: 6px 0; }
.payok { text-align: center; padding: 18px 0 6px; }
.payok .ok { width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 12px; background: var(--ok); color: #fff; display: grid; place-items: center; animation: pop .45s; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgb(255 255 255 / .35); border-top-color: #fff; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg) } }
.att { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
.att .tg { display: flex; gap: 6px; margin-left: auto; }

.att .tg button.yes.on { background: var(--ok); color: #fff; }

.range { width: 100%; accent-color: var(--brand); }

<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="assets/core.js" data-frame="app"></script>
<script>
(function () {
'use strict';
const L = PC.L, T = PC.T, ic = PC.ic, esc = PC.esc;
const EMBED = /embed/.test(location.search);
let S = PC.S;
const ui = { tab: 'home', sub: { liga: 'equipo', escuela: 'grupo', club: 'carnet' }, sheet: null, ligaGroup: null, flashTeam: null };
let cueIds = [];
let seen = new Set();
const resetSeen = () => { seen = new Set(PC.notifsFor(S.persona).map((n) => n.id)); };

/* ---------- utilidades de interfaz ---------- */
const P = () => PC.persona();
const myTeam = () => (P().team ? PC.team(P().team) : null);
const isCap = () => P().role === 'captain';
const brand = () => PC.brand();
function toast(title, body, icon = 'check', app) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ti">${ic(icon, 18)}</div><div>${app ? `<div class="tapp">${esc(app)}</div>` : ''}<b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}</div>`;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s, transform .4s'; el.style.opacity = '0'; el.style.transform = 'translateY(-10px)'; }, 4200);
  setTimeout(() => el.remove(), 4700);
}
function banner(n) {
  const kindIc = { change: 'swap', ok: 'check', warn: 'alert', result: 'trophy', school: 'school', pay: 'euro', msg: 'msg', sub: 'sub', trophy: 'trophy', info: 'info' }[n.kind] || 'bell';
  toast(T(n.title), T(n.body), kindIc, `${brand().w1} ${brand().w2} · ${L('ahora', 'orain')}`);
}
function checkNew() {
  PC.notifsFor(S.persona).forEach((n) => {
    if (!seen.has(n.id)) { seen.add(n.id); if (!n.read[S.persona]) banner(n); }
  });
}
const post = (msg) => { try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {} };

/* ---------- piezas comunes ---------- */
function tileRow(m, k) {
  if (m.st === 'played' && m.np) return `<span class="tile ${m.np === k ? '' : 'win'}" style="width:auto;padding:0 8px;font-size:13px">${m.np === k ? 'NP' : 'W.O.'}</span>`;
  const sets = m.st === 'played' ? m.sets : m.st === 'awaiting' ? m.pending.sets : null;
  if (!sets) return `<span class="tile idle">–</span><span class="tile idle">–</span>`;
  return sets.map((s) => { const mine = k === 'a' ? s[0] : s[1], oth = k === 'a' ? s[1] : s[0]; return `<span class="tile ${mine > oth ? 'win' : ''} ${m.st === 'awaiting' ? 'live' : ''}">${String(mine).padStart(2, '0')}</span>`; }).join('');
}
function statusOf(m) {
  if (m.st === 'played') return { t: L('Finalizado', 'Amaituta'), c: '' };
  if (m.st === 'awaiting') return { t: L('Por confirmar', 'Berresteko'), c: 'warn' };
  if (m.st === 'disputed') return { t: L('En revisión', 'Berrikusten'), c: 'warn' };
  if (m.resultDue) return { t: L('Resultado pendiente', 'Emaitza falta'), c: 'bad' };
  if (m.at.slice(0, 10) === PC.TODAY) return { t: L('Hoy', 'Gaur') + ' ' + PC.time(m.at), c: 'ball' };
  return { t: PC.fDay(m.at), c: 'brand' };
}
function matchCard(m, opt = {}) {
  const me = myTeam();
  const A = PC.team(m.a), B = PC.team(m.b);
  const o = m.st === 'played' ? PC.outcome(m) : null;
  const st = statusOf(m);
  const mine = me && (m.a === me.id || m.b === me.id);
  const row = (k, t) => {
    const lost = o && o[k] !== 'W' && o[k] !== 'T';
    const ps = PC.teamPlayers(t).map((p) => (m.sub && m.sub[p.id] ? S.players[m.sub[p.id]].name + ' *' : p.name)).join(' · ');

function radar(e, size = 270) {
  const c = size / 2, r = size / 2 - 42, n = PC.SKILLS.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [c + Math.cos(a) * r * (v / 10), c + Math.sin(a) * r * (v / 10)]; };
  const poly = (vals) => PC.SKILLS.map(([k], i) => pt(i, vals[k]).map((x) => x.toFixed(1)).join(',')).join(' ');
  let rings = '';
  [2.5, 5, 7.5, 10].forEach((v) => { rings += `<polygon points="${PC.SKILLS.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="#e2e8f0"/>`; });
  const axes = PC.SKILLS.map((_, i) => { const [x, y] = pt(i, 10); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#e2e8f0"/>`; }).join('');
  const labels = PC.SKILLS.map(([k, es, eu], i) => { const [x, y] = pt(i, 12.6); return `<text x="${x}" y="${y + 3}" text-anchor="middle">${esc(L(es, eu))} · ${e.cur[k]}</text>`; }).join('');
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;display:block;margin:0 auto">${rings}${axes}
    <polygon points="${poly(e.start)}" fill="rgb(148 163 184 / .14)" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.5"/>
    <polygon points="${poly(e.cur)}" fill="color-mix(in srgb, var(--brand) 22%, transparent)" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round"/>
    ${PC.SKILLS.map(([k], i) => { const [x, y] = pt(i, e.cur[k]); return `<circle cx="${x}" cy="${y}" r="3.6" fill="var(--ball)" stroke="var(--brand-deep)" stroke-width="1.5"/>`; }).join('')}
    ${labels}</svg>`;
}
function qrSvg(seed) {
  const R = PC.rng(seed); const n = 25; let cells = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0b1a3a"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#0b1a3a"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if ((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) continue;
    if (R() < 0.48) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" width="100%" height="100%" shape-rendering="crispEdges"><g fill="#0b1a3a">${cells}</g>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
}

function sheetWrap(title, inner, sub) {
  return `<div class="sheet-bg" data-a="closeSheet" data-self="1"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh"><div class="grow">${sub ? `<div class="eyebrow" style="margin-bottom:4px">${sub}</div>` : ''}<h3>${title}</h3></div><button class="x" data-a="closeSheet" aria-label="${L('Cerrar', 'Itxi')}">${ic('x', 18)}</button></div>${inner}</div></div>`;
}
function notifHtml(n) {
  const unread = !n.read[S.persona];
  const kindIc = { change: 'swap', ok: 'check', warn: 'alert', result: 'trophy', school: 'school', pay: 'euro', msg: 'msg', sub: 'sub', trophy: 'trophy', info: 'info' }[n.kind] || 'bell';
  return `<button class="notif ${unread ? 'unread' : ''}" data-a="notifGo" data-id="${n.id}"><div class="ti">${ic(kindIc, 18)}</div><div class="grow"><b>${esc(T(n.title))}</b><p>${esc(T(n.body))}</p><small>${n.from === 'club' ? esc(brand().short) + ' · ' : ''}${PC.fAgo(n.ts)}</small></div></button>`;
}
function renderSheet() {
  const s = ui.sheet; if (!s) return '';
  const me = myTeam();
  if (s.type === 'notifs') {
    const list = PC.notifsFor(S.persona);
    return sheetWrap(L('Avisos', 'Oharrak'), `<div class="col">${list.map(notifHtml).join('') || `<div class="empty">${L('Nada nuevo', 'Ezer berririk ez')}</div>`}</div>`);
  }
  if (s.type === 'match') {
    const m = PC.match(s.id); const A = PC.team(m.a), B = PC.team(m.b);
    const mine = me && (m.a === me.id || m.b === me.id);
    const side = mine ? PC.side(m, me.id) : null, other = side === 'a' ? 'b' : 'a';
    const c = m.chgReq && S.changes.find((x) => x.id === m.chgReq);
    const canChange = mine && isCap() && m.st === 'scheduled' && !m.resultDue && !c && (m.chg || 0) < PC.RULES.changesPerMatch;
    let pact = '';
    if (mine && m.st === 'scheduled' && !m.resultDue) {
      const my = m.pact && m.pact[side], th = m.pact && m.pact[other];
      pact = `<section class="card pad"><div class="row between"><b>${L('Si quedan menos de 20 minutos tras el 2º set', '2. setaren ondoren 20 minutu baino gutxiago geratzen badira')}</b></div>
        <div class="row" style="margin-top:10px;gap:8px">${['stb', 'set'].map((v) => `<button class="opt ${my === v ? 'on' : ''}" style="flex:1;padding:10px" data-a="pact" data-id="${m.id}" data-v="${v}" data-cue="pact-${v}"><span class="radio"></span><span style="font-size:13px;font-weight:600">${v === 'stb' ? L('Supertiebreak a 11', 'Supertiebreak 11ra') : L('Tercer set', 'Hirugarren seta')}</span></button>`).join('')}</div>
        <div class="muted" style="font-size:12.5px;margin-top:8px">${th ? (th === my ? `<span style="color:var(--ok);font-weight:600">${ic('check', 13)} ${L('Pactado por los dos capitanes. Nada que discutir en pista.', 'Bi kapitainek adostuta. Pistan ez dago eztabaidatzeko ezer.')}</span>` : L(`${PC.team(m[other]).name} ha elegido ${pactName(th)}.`, `${PC.team(m[other]).name} taldeak ${pactName(th)} aukeratu du.`)) : L(`Falta lo que elija ${PC.team(m[other]).name}.`, `${PC.team(m[other]).name} taldearen aukera falta da.`)}</div></section>`;
    }
    let chgBlock = '';
    if (c) {
      const steps = [[L('Propuesta enviada', 'Proposamena bidalita'), PC.team(c.by).name + ' · ' + PC.fAgo(c.ts), true], [L('El rival elige', 'Aurkariak aukeratzen du'), c.pick ? PC.fWhen(c.pick) : L(`${c.opts.length} opciones`, `${c.opts.length} aukera`), c.st === 'accepted'], [L('El club valida', 'Klubak baliozkotzen du'), L('y se actualiza el calendario', 'eta egutegia eguneratzen da'), false]];

      <div class="todo"><div class="ti" style="background:var(--warn-soft);color:var(--warn)">${ic('info', 18)}</div><div class="grow"><small style="color:var(--ink-2)">${L('Es el único cambio permitido para este partido. Hasta que el rival elija y el club valide, se mantiene la fecha original.', 'Partida honetarako baimendutako aldaketa bakarra da. Aurkariak aukeratu eta klubak baliozkotu arte, jatorrizko data mantentzen da.')}</small></div></div>

  }

const TABS_COACH = [['home', 'whistle', () => L('Hoy', 'Gaur')], ['grupos', 'grid', () => L('Grupos', 'Taldeak')], ['alumnos', 'users', () => L('Alumnos', 'Ikasleak')], ['avisos', 'msg', () => L('Avisos', 'Oharrak')], ['yo', 'user', () => L('Yo', 'Ni')]];
function render() {
  S = PC.S;
  PC.applyBrand();
  const app = document.getElementById('app');
  const mainOld = app.querySelector('main');
  const sc = mainOld ? mainOld.scrollTop : 0;
  const sheetOld = app.querySelector('.sheet');
  const ssc = sheetOld ? sheetOld.scrollTop : 0;
  const coach = P().role === 'coach';
  const tabs = coach ? TABS_COACH : TABS_MEMBER;
  if (!tabs.some((t) => t[0] === ui.tab)) ui.tab = 'home';
  let body = '';
  if (ui.tab === 'home') body = coach ? homeCoach() : P().role === 'captain' ? homeCaptain() : P().role === 'student' ? homeStudent() : homeFamily();
  else if (ui.tab === 'liga') body = ligaTab();
  else if (ui.tab === 'escuela') body = escuelaTab();
  else if (ui.tab === 'club') body = clubTab();
  else if (ui.tab === 'yo') body = yoTab();
  else if (ui.tab === 'grupos') body = coachGroups();
  else if (ui.tab === 'alumnos') body = coachStudents();
  else if (ui.tab === 'avisos') body = coachMsgs();
  const unread = PC.unread(S.persona);
  const hh = String(PC.now().getHours()).padStart(2, '0') + ':' + String(PC.now().getMinutes()).padStart(2, '0');
  app.innerHTML = `${EMBED ? `<div class="sbar"><span class="tnum">${hh}</span><span class="r">${ic('bolt', 13)}<span style="font-size:12px">5G</span><span class="bat"></span></span></div>` : ''}
  <header class="top">${PC.logo()}<div class="act"><button class="iconbtn" data-a="openNotifs" aria-label="${L('Avisos', 'Oharrak')}" data-cue="bell">${ic('bell', 20)}${unread ? `<span class="badge">${unread}</span>` : ''}</button><button class="me-btn" data-a="tab" data-v="yo" data-cue="me">${PC.ini(P().name)}</button></div></header>
  <main id="main">${body}</main>
  <nav class="tabbar">${tabs.map(([id, icn, lab]) => `<button class="${ui.tab === id ? 'on' : ''}" data-a="tab" data-v="${id}" data-cue="nav-${id}">${ic(icn, 21)}<span>${lab()}</span>${id === 'avisos' && unread ? `<span class="badge">${unread}</span>` : ''}</button>`).join('')}</nav>
  ${renderSheet()}`;
  const main = app.querySelector('main');
  if (main && !ui.resetScroll) main.scrollTop = sc;
  ui.resetScroll = false;
  const sh = app.querySelector('.sheet');
  if (sh && ui.keepSheetScroll) sh.scrollTop = ssc;
  ui.keepSheetScroll = false;
  applyCue();
  post({ t: 'ui', frame: 'app', tab: ui.tab, sub: ui.sub, sheet: ui.sheet && ui.sheet.type, persona: S.persona });
}
function applyCue() {
  document.querySelectorAll('.cue').forEach((e) => e.classList.remove('cue'));
  if (!cueIds.length) return;
  for (let i = cueIds.length - 1; i >= 0; i--) {
    const el = document.querySelector(`[data-cue="${cueIds[i]}"]`);
    if (el) { el.classList.add('cue'); if (i === cueIds.length - 1 && !ui.sheet) { try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} } break; }
  }
}
function go(tab, sub, resetScroll = true) {
  ui.tab = tab;
  if (sub) { if (tab === 'liga') ui.sub.liga = sub; if (tab === 'escuela') ui.sub.escuela = sub; if (tab === 'club') ui.sub.club = sub; }
  ui.sheet = null; ui.resetScroll = resetScroll;
  render();
}
function commit(what) { PC.commit(what); }

/* ---------- acciones ---------- */
const A = {
  tab: (d) => go(d.v),
  sub: (d) => { ui.sub[d.k] = d.v; ui.resetScroll = true; render(); },
  ligaGroup: (d) => { ui.ligaGroup = +d.v; render(); },
  closeSheet: (d, el, ev) => { if (d.self && ev.target !== el) return; ui.sheet = null; render(); },
  openNotifs: () => { ui.sheet = { type: 'notifs' }; render(); PC.markRead(S.persona); PC.commit('read'); },
  notifGo: (d) => { const n = S.notifs.find((x) => x.id === d.id); ui.sheet = null; if (n && n.go) { if (n.go.sheet === 'change-answer') { const c = S.changes.find((x) => x.id === n.go.id); if (c && c.st === 'proposed') { ui.tab = 'home'; ui.sheet = { type: 'answer', id: c.id }; render(); return; } } go(n.go.tab, n.go.sub); } else render(); },
  openMatch: (d) => { ui.sheet = { type: 'match', id: d.id }; render(); },
  openChange: (d) => { ui.sheet = { type: 'change', id: d.id, sel: [] }; render(); },
  chgDay: (d) => { ui.sheet.day = d.v; ui.keepSheetScroll = true; render(); },
  chgReason: (d) => { ui.sheet.reason = d.v; ui.keepSheetScroll = true; render(); },
  chgSlot: (d) => { const s = ui.sheet; const i = s.sel.indexOf(d.v); if (i >= 0) s.sel.splice(i, 1); else if (s.sel.length < 3) s.sel.push(d.v); else toast(L('Máximo 3 opciones', 'Gehienez 3 aukera'), '', 'info'); s.sel.sort(); ui.keepSheetScroll = true; render(); },
  suggest: () => {
    const s = ui.sheet; const m = PC.match(s.id);
    const teamDays = S.matches.filter((x) => x.id !== m.id && (x.a === m.a || x.b === m.a || x.a === m.b || x.b === m.b)).map((x) => x.at.slice(0, 10));
    const pref = ['2026-11-23T20:30', '2026-11-24T19:00', '2026-11-28T12:00', '2026-11-22T12:00', '2026-11-27T19:00', '2026-11-23T19:00', '2026-11-29T10:30', '2026-11-24T20:30'];
    const out = [];
    pref.forEach((iso) => { if (out.length < 3 && PC.slotState(iso, m.id).ok && !teamDays.includes(iso.slice(0, 10)) && !out.some((o) => o.slice(0, 10) === iso.slice(0, 10))) out.push(iso); });
    s.sel = out; s.day = out[0].slice(0, 10); s.reason = s.reason || L('Trabajo', 'Lana');
    toast(L('3 horarios sugeridos', '3 ordutegi iradokita'), L('Franjas libres de liga en las que soléis jugar los dos equipos.', 'Bi taldeek jokatu ohi duzuen liga-ordutegi libreak.'), 'sparkle');
    ui.keepSheetScroll = true; render();
  },
  sendChange: () => { const s = ui.sheet; const me = myTeam(); PC.proposeChange(s.id, me.id, s.sel.slice(), s.reason); ui.sheet = { type: 'match', id: s.id }; commit('change'); render(); toast(L('Propuesta enviada', 'Proposamena bidalita'), L(`${PC.team(PC.vs(PC.match(s.id), me.id)).name} elegirá uno de tus ${s.sel.length} horarios.`, `${PC.team(PC.vs(PC.match(s.id), me.id)).name} taldeak zure ${s.sel.length} ordutegietako bat aukeratuko du.`), 'send'); },
  openAnswer: (d) => { ui.sheet = { type: 'answer', id: d.id }; render(); },
  pick: (d) => { ui.sheet.pick = d.v; render(); },
  acceptChange: () => { const s = ui.sheet; PC.acceptChange(s.id, s.pick); const c = S.changes.find((x) => x.id === s.id); ui.sheet = { type: 'match', id: c.m }; commit('change'); render(); toast(L('Horario aceptado', 'Ordutegia onartuta'), L('Lo hemos enviado al club para que lo valide. Sin llamadas ni mensajes privados.', 'Klubari bidali diogu baliozkotzeko. Deirik eta mezu pribaturik gabe.'), 'check'); },
  declineChange: () => { PC.rejectChangeByRival(ui.sheet.id); ui.sheet = null; commit('change'); render(); toast(L('Respuesta enviada', 'Erantzuna bidalita'), L('El partido se queda en su fecha.', 'Partidak bere data mantentzen du.'), 'info'); },
  pact: (d) => { const m = PC.match(d.id); const me = myTeam(); PC.setPact(m.id, PC.side(m, me.id), d.v); commit('pact'); ui.keepSheetScroll = true; render(); },
  openResult: (d) => { ui.sheet = { type: 'result', id: d.id, sets: [[6, 4], [3, 6], [11, 8]], end: 'stb' }; render(); },
  endType: (d) => { const s = ui.sheet; s.end = d.v; if (d.v === 'full' && s.sets[2][0] > 7) s.sets[2] = [0, 0]; if (d.v === 'stb' && s.sets[2][0] < 9 && s.sets[2][1] < 9) s.sets[2] = [11, 8]; if (d.v === 'time') s.sets[2] = [4, 3]; ui.keepSheetScroll = true; render(); },
  setInc: (d) => { const s = ui.sheet; const v = s.sets[+d.s][+d.k] + +d.d; const max = s.end === 'stb' && +d.s === 2 ? 30 : 7; s.sets[+d.s][+d.k] = Math.max(0, Math.min(max, v)); ui.keepSheetScroll = true; render(); },
  sendResult: () => {
    const s = ui.sheet; const m = PC.match(s.id); const me = myTeam();
    let sets = s.sets.map((x) => x.slice());
    if (s.end !== 'np' && (s.end === 'full' || s.end === 'time') && sets[2][0] === 0 && sets[2][1] === 0) sets = sets.slice(0, 2);
    const res = { sets: s.end === 'np' ? null : sets, end: s.end, np: s.end === 'np' ? (me.id === m.a ? 'b' : 'a') : null };
    PC.submitResult(m.id, me.id, res); m.resultDue = false;
    ui.sheet = null; commit('result'); render();
    const rival = PC.team(PC.vs(m, me.id));
    toast(L('Resultado enviado', 'Emaitza bidalita'), L(`${rival.name} tiene que confirmarlo. Si no coincide, lo revisa el club.`, `${rival.name} taldeak berretsi behar du. Bat ez badator, klubak berrikusiko du.`), 'send');
    setTimeout(() => { PC.confirmResult(m.id); ui.flashTeam = me.id; PC.commit('result-confirmed'); toast(L(`${rival.name} ha confirmado el resultado`, `${rival.name} taldeak emaitza berretsi du`), '', 'check', `${brand().w1} ${brand().w2}`); render(); setTimeout(() => { ui.flashTeam = null; }, 2500); }, 3400);
  },
  openSub: (d) => { const me = myTeam(); const id = d.id || PC.nextMatch(me.id).id; ui.sheet = { type: 'sub', id }; render(); },
  subOut: (d) => { ui.sheet.out = d.v; ui.sheet.inn = null; ui.keepSheetScroll = true; render(); },
  subIn: (d) => { ui.sheet.inn = d.v; ui.keepSheetScroll = true; render(); },
  sendSub: () => { const s = ui.sheet; const me = myTeam(); const out = s.out || PC.teamPlayers(me)[1].id; PC.requestSub(s.id, me.id, out, s.inn); ui.sheet = { type: 'match', id: s.id }; commit('sub'); render(); toast(L('Enviado al club', 'Klubari bidalita'), L('Ya cumple la normativa de nivel. Te avisamos en cuanto lo aprueben.', 'Maila-araua betetzen du. Onartzen dutenean abisatuko dizugu.'), 'send'); },
  ics: (d) => {
    const m = PC.match(d.id); const A_ = PC.team(m.a), B_ = PC.team(m.b);
    const f = (iso) => iso.replace(/[-:]/g, '') + '00';
    const end = PC.iso(new Date(PC.parse(m.at).getTime() + 90 * 60000));
    const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ondora Studio//Demo//ES', 'BEGIN:VEVENT', `UID:${m.id}@demo-club`, 'DTSTAMP:20261117T184500', `DTSTART:${f(m.at)}`, `DTEND:${f(end)}`, `SUMMARY:${A_.name} – ${B_.name} (${brand().league})`, `LOCATION:${brand().venue} · Pista ${m.court}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/calendar' })); a.download = 'partido-liga.ics'; document.body.appendChild(a); a.click(); a.remove();
    toast(L('Añadido al calendario', 'Egutegira gehituta'), L('Si el partido cambia, tu calendario se actualiza solo.', 'Partida aldatzen bada, zure egutegia berez eguneratuko da.'), 'cal');
  },
  openTimer: (d) => { ui.sheet = { type: 'timer', id: d.id, start: Date.now(), skip: 0 }; render(); },
  skipTimer: () => { const s = ui.sheet; s.skip = 90 * 60 - 19 * 60 - Math.floor((Date.now() - s.start) / 1000); render(); },
  openPay: (d) => { ui.sheet = { type: 'pay', id: d.id, method: 'Bizum' }; render(); },
  payMethod: (d) => { ui.sheet.method = d.v; render(); },
  doPay: () => { const s = ui.sheet; if (s.busy) return; s.busy = true; render(); setTimeout(() => { PC.payReceipt(s.id, s.method || 'Bizum'); s.busy = false; s.done = true; commit('pay'); render(); }, 1300); },
  absence: (d) => { PC.notifyAbsence(d.sid, d.d); commit('absence'); ui.sub.escuela = 'grupo'; if (ui.tab !== 'escuela') { ui.tab = 'escuela'; ui.resetScroll = true; } render(); toast(L('Avisado', 'Abisatuta'), L('Tu plaza queda libre para otra persona y ganas una recuperación.', 'Zure plaza beste norbaitentzat geratzen da eta berreskuratze bat irabazten duzu.'), 'check'); setTimeout(() => { const el = document.querySelector('[data-cue="makeups"]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 120); },
  unabsence: (d) => { PC.cancelAbsence(d.sid, d.d); commit('absence'); render(); },
  makeup: (d) => { PC.bookMakeup(d.sid, d.g, d.d); commit('makeup'); render(); toast(L('Recuperación reservada', 'Berreskuratzea erreserbatuta'), L('El entrenador ya te tiene en su lista.', 'Entrenatzaileak bere zerrendan zaitu jada.'), 'check'); },
  goSchool: () => go('escuela', 'grupo'),
  goEvol: () => go('escuela', 'evol'),
  goPagos: () => go('escuela', 'pagos'),
  openRoll: (d) => { const a = PC.attendees(d.g, d.d); const vals = {}; a.list.forEach((x) => (vals[x.s.id] = x.absent ? 'exc' : 'yes')); ui.sheet = { type: 'roll', g: d.g, d: d.d, vals }; render(); },
  roll: (d) => { ui.sheet.vals[d.sid] = d.v; ui.keepSheetScroll = true; render(); },
  closeRoll: () => { const s = ui.sheet; Object.entries(s.vals).forEach(([sid, v]) => PC.setAttendance(s.g, s.d, sid, v)); PC.closeClass(s.g, s.d); ui.sheet = null; commit('roll'); render(); toast(L('Asistencia guardada', 'Asistentzia gordeta'), L('El club la ve al momento en su panel.', 'Klubak berehala ikusten du bere panelean.'), 'check'); },
  openEval: (d) => { const e = S.evals[d.sid]; const base = e ? { ...e.cur } : { der: 5, rev: 4, vol: 5, ban: 3, vib: 2, rem: 3, sr: 5, tac: 4 }; const vals = { ...base }; if (d.sid === 's-leire') { vals.ban = 6; vals.vib = 4; } ui.sheet = { type: 'eval', sid: d.sid, vals, note: d.sid === 's-leire' ? L('Bandeja mucho más controlada: ya no la conviertes en remate. Siguiente paso, la víbora.', 'Bandeja askoz kontrolatuagoa: jada ez duzu errematea bihurtzen. Hurrengo urratsa, bibora.') : '' }; render(); },
  skill: (d, el) => { ui.sheet.vals[d.k] = +el.value; el.nextElementSibling.textContent = el.value; },
  saveEval: () => { const s = ui.sheet; const note = document.getElementById('evnote').value.trim(); const goal = document.getElementById('evgoal').value.trim(); PC.evaluate(s.sid, s.vals, note, goal, P().coach); ui.sheet = null; commit('eval'); render(); toast(L('Evolución enviada', 'Bilakaera bidalita'), L('Le llega al móvil con la gráfica actualizada.', 'Mugikorrera iristen zaio grafiko eguneratuarekin.'), 'chart'); },
  coachSend: () => { const gid = document.getElementById('cg').value; const g = PC.group(gid); const txt = document.getElementById('cm').value.trim(); if (!txt) return; PC.sendMessage(g.kind === 'kids' ? 'escuela-familias' : 'escuela-adultos', { es: `${PC.coach(g.coach).short} · ${g.lvl} ${g.time}`, eu: `${PC.coach(g.coach).short} · ${g.lvlEu} ${g.time}` }, { es: txt, eu: txt === 'El jueves hacemos la última media hora de partido: traed agua.' ? 'Ostegunean azken ordu erdia partida izango da: ekarri ura.' : txt }); commit('msg'); render(); toast(L('Enviado al grupo', 'Taldeari bidalita'), '', 'send'); },
  coachWrite: () => toast(L('Mensaje preparado', 'Mezua prest'), L('Se abre un mensaje directo a Josu, sin dar tu teléfono personal.', 'Josuri mezu zuzena irekitzen zaio, zure telefono pertsonala eman gabe.'), 'msg'),
  persona: (d) => { S.persona = d.v; ui.tab = 'home'; ui.sheet = null; ui.resetScroll = true; commit('persona'); resetSeen(); render(); },
  lang: (d) => { S.lang = d.v; commit('lang'); render(); },
  openEvent: (d) => { ui.sheet = { type: 'event', id: d.id }; render(); },
  joinEvent: (d) => { const e = S.events.find((x) => x.id === d.id); e.joined = e.joined || []; if (!e.joined.includes(S.persona)) { e.joined.push(S.persona); e.n++; } PC.log(`${P().name} se apunta a ${e.name} (${e.n}/${e.cap})`, 'com', 'star'); ui.sheet = null; commit('event'); render(); toast(L('¡Dentro!', 'Barruan!'), L('Te recordamos el día antes. Pago en recepción o desde la app.', 'Egun bat lehenago gogoraraziko dizugu.'), 'star'); },
  joinLeague: () => toast(L('Inscripción a la Fase II', 'II. faserako izen-ematea'), L('Formulario de equipo con nivel Playtomic y aceptación de la normativa.', 'Talde-formularioa Playtomic mailarekin eta araudia onartuta.'), 'trophy'),
  askSpot: () => toast(L('Solicitud enviada', 'Eskaera bidalita'), L('Te apuntamos a la lista de espera de ese grupo y te avisamos al quedar plaza.', 'Talde horren itxaron-zerrendan sartu zaitugu.'), 'school'),
  beMember: () => toast(L('Alta de socio', 'Bazkide altan'), L('Mandato SEPA firmado en el móvil. Sin papeles en recepción.', 'SEPA agindua mugikorrean sinatuta. Paperik gabe.'), 'card'),
  receipt: () => toast(L('Recibo descargado', 'Ordainagiria deskargatuta'), L('PDF con TicketBAI.', 'PDFa TicketBAI-rekin.'), 'download'),
  noop: () => toast(L('En la app real abre el teléfono o el mapa', 'Benetako aplikazioan telefonoa edo mapa irekitzen da'), '', 'info'),
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const fn = A[el.dataset.a];
  if (!fn) return;
  if (el.tagName === 'A') return;
  ev.preventDefault();
  fn(el.dataset, el, ev);
});
document.addEventListener('input', (ev) => { const el = ev.target; if (el.dataset && el.dataset.a === 'skill') A.skill(el.dataset, el); });

/* ---------- sincronización y guía ---------- */
PC.on((what, local) => {
  if (what && typeof what === 'object') {
    if (what.t === 'cue' && (what.frame === 'app' || !what.frame)) { cueIds = what.ids || []; applyCue(); }
    if (what.t === 'nav' && what.frame === 'app') applyNav(what);
    return;
  }
  if (what === 'reset') { location.reload(); return; }
  S = PC.S;
  if (!local) {
    if (what === 'persona') { ui.tab = 'home'; ui.sheet = null; resetSeen(); }
    if (ui.sheet && ui.sheet.type === 'answer') { const c = S.changes.find((x) => x.id === ui.sheet.id); if (!c || c.st !== 'proposed') ui.sheet = null; }
    ui.keepSheetScroll = true;
    render();
  }
  checkNew();
});
function applyNav(n) {
  if (n.persona && n.persona !== S.persona) { S.persona = n.persona; PC.commit('persona'); resetSeen(); }
  if (n.lang) { S.lang = n.lang; PC.commit('lang'); }
  ui.sheet = null;
  if (n.tab) { ui.tab = n.tab; ui.resetScroll = true; }
  if (n.sub) { ui.sub[n.tab] = n.sub; }
  if (n.sheet) ui.sheet = n.sheet;
  render();
}
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.t === 'cue' && (m.frame === 'app' || !m.frame)) { cueIds = m.ids || []; applyCue(); }
  if (m.t === 'nav' && m.frame === 'app') applyNav(m);
});
setInterval(() => {
  if (ui.sheet && ui.sheet.type === 'timer') {
    const s = ui.sheet; const left = Math.max(0, 90 * 60 - Math.floor((Date.now() - s.start) / 1000) - (s.skip || 0));
    const el = document.getElementById('tleft'); if (el) el.textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
  }
}, 1000);
resetSeen();
render();
})();
</script>
