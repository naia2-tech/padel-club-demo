<!doctype html>
<html lang="es" data-brand="doss">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1a3a">
<title>Panel del club · Demo</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="assets/ui.css">
<style>
html, body { height: 100%; }
body { overflow: hidden; background: #f4f6fb; font-size: 13.5px; }
.pn { display: grid; grid-template-columns: 232px 1fr; height: 100%; }
.side { background: var(--brand-deep); color: #fff; display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
[data-brand="oarso"] .side { background: var(--navy); }
.side .logo { padding: 4px 8px 14px; }
.side .logo .wm { font-size: 21px; }
.side .club { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: rgb(255 255 255 / .5); padding: 0 10px 10px; font-weight: 700; }
.nv { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 12px; color: rgb(255 255 255 / .78); font-weight: 600; font-size: 13.5px; width: 100%; text-align: left; position: relative; }
.nv:hover { background: rgb(255 255 255 / .06); }
.nv.on { background: rgb(255 255 255 / .1); color: #fff; }
.nv.on::before { content: ''; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--ball); }
.nv.on .ic { color: var(--ball); }
.nv .badge { margin-left: auto; }
.side .sep { height: 1px; background: rgb(255 255 255 / .08); margin: 8px 6px; }
.side .who { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: rgb(255 255 255 / .06); }
.side .who .avatar { background: var(--ball); color: var(--ball-ink); }
.side .who small { display: block; color: rgb(255 255 255 / .55); font-size: 11.5px; }
.mainp { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.ph { display: flex; align-items: center; gap: 12px; padding: 16px 22px 12px; background: #f4f6fb; flex-wrap: wrap; }
.ph h1 { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1; color: var(--brand-deep); }
.ph .date { color: var(--muted); font-size: 12.5px; }
.ph .srch { margin-left: auto; position: relative; }
.ph .srch input { width: 250px; padding-left: 36px; min-height: 38px; border-radius: 12px; }
.ph .srch .ic { position: absolute; left: 11px; top: 10px; color: var(--faint); }
.content { flex: 1; overflow-y: auto; padding: 4px 22px 40px; }
.content > * + * { margin-top: 16px; }
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.kpi .v { font: 700 30px/1.1 var(--f-score); margin-top: 6px; color: var(--brand-deep); letter-spacing: -.02em; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.hot { background: var(--brand-deep); color: #fff; border-color: var(--brand-deep); }
.kpi.hot .k, .kpi.hot .s { color: rgb(255 255 255 / .65); }
.kpi.hot .v { color: var(--ball); }
.two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panelc { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.panelc > .hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.panelc > .hd h2 { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 21px; color: var(--brand-deep); line-height: 1; }
.panelc > .hd .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.panelc > .bd { padding: 0 16px 16px; }
.q { border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; background: #fff; }
.q + .q { margin-top: 10px; }
.q.hot { border: 2px solid var(--ball); box-shadow: 0 0 0 4px rgb(220 255 61 / .25); }
.q .qt { display: flex; gap: 10px; align-items: flex-start; }
.q .qi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.q b.t { font-size: 14px; display: block; }
.q .sub { color: var(--muted); font-size: 12.5px; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 4px 12px; margin: 10px 0; font-size: 12.5px; }
.checks span { display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
.checks .ok { color: var(--ok); }
.checks .no { color: var(--bad); }
.qa { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mv { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; margin-top: 6px; }
.mv .from { text-decoration: line-through; color: var(--faint); }
.mv .to { font-weight: 700; background: var(--ball); color: var(--ball-ink); padding: 2px 8px; border-radius: 7px; }
.gantt { position: relative; font-size: 11px; }
.gantt .hrs { display: grid; margin-left: 56px; color: var(--faint); font-weight: 600; }
.gantt .lane { display: flex; align-items: center; height: 36px; border-top: 1px solid var(--line-2); }
.gantt .lane > span { width: 56px; font-weight: 700; color: var(--muted); flex: none; }
.gantt .track { position: relative; flex: 1; height: 100%; }
.gantt .blk { position: absolute; top: 5px; bottom: 5px; border-radius: 8px; padding: 3px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; line-height: 1.15; display: flex; flex-direction: column; justify-content: center; font-size: 10.5px; }
.gantt .liga { background: var(--brand); color: #fff; }
.gantt .esc { background: var(--ball); color: var(--ball-ink); }
.gantt .pt { background: repeating-linear-gradient(-45deg, #e8edf5 0 5px, #f1f4f9 5px 10px); color: var(--muted); border: 1px solid #dfe5ef; }
.gantt .nowl { position: absolute; top: 18px; bottom: 0; width: 2px; background: var(--bad); z-index: 2; }
.gantt .nowl::before { content: 'ahora'; position: absolute; top: -16px; left: -14px; font-size: 10px; color: var(--bad); font-weight: 700; }
.log { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-2); font-size: 12.8px; }
.log:first-child { border-top: 0; }
.log .li2 { width: 28px; height: 28px; border-radius: 9px; background: var(--line-2); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.log time { color: var(--faint); font-size: 11.5px; display: block; }
.log.new { animation: flash 2.2s ease-out; border-radius: 10px; }
table.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
.tb th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 8px 10px; font-weight: 700; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tb td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tb tr:hover td { background: #fafbfe; }
.tbw { overflow-x: auto; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.gcard { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 12px; box-shadow: var(--shadow); }
.gcard h3 { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 19px; color: var(--brand-deep); }
.gcard .stand td { padding: 5px 3px; font-size: 12px; }
.gcard .stand th { padding: 5px 3px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; overflow-x: auto; }
.wd { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-height: 160px; }
.wd.off { background: repeating-linear-gradient(-45deg, #f6f8fb 0 8px, #eef2f7 8px 16px); }
.wd h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
.wd .mm { border-radius: 10px; padding: 6px 8px; background: var(--brand-soft); margin-bottom: 6px; font-size: 11.5px; line-height: 1.3; border-left: 3px solid var(--brand); }
.wd .mm.g3 { background: rgb(220 255 61 / .35); border-left-color: var(--ball-dark); }
.wd .mm.chg { outline: 2px dashed var(--brand); }
.wd .mm b { font-family: var(--f-score); font-size: 11px; }
.sched { display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); gap: 8px; overflow-x: auto; }
.sched .col2 { display: flex; flex-direction: column; gap: 8px; }
.sched h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.gb { border-radius: 14px; padding: 9px 10px; background: #fff; border: 1px solid var(--line); text-align: left; width: 100%; box-shadow: var(--shadow); }
.gb.kids { border-left: 4px solid var(--ball-dark); }
.gb.adult { border-left: 4px solid var(--brand); }
.gb b { display: block; font-size: 13px; }
.gb small { color: var(--muted); font-size: 11.5px; display: block; }
.occ { display: flex; gap: 3px; margin-top: 6px; }
.occ i { width: 12px; height: 12px; border-radius: 4px; background: var(--brand); }
.occ i.free { background: #fff; border: 1.5px dashed var(--ok); }
.occ i.abs { background: #fde68a; }
.occ i.mk { background: var(--ball-dark); }
.drawer-bg { position: fixed; inset: 0; background: rgb(7 15 36 / .4); z-index: 60; display: flex; justify-content: flex-end; animation: fade .2s; }
@keyframes fade { from { opacity: 0 } }
.drawer { width: min(460px, 100%); height: 100%; background: #f4f6fb; overflow-y: auto; padding: 18px; animation: slide .25s ease-out; }
@keyframes slide { from { transform: translateX(30%) } }
.drawer > * + * { margin-top: 12px; }
.modal-bg { position: fixed; inset: 0; background: rgb(7 15 36 / .55); z-index: 70; display: grid; place-items: center; padding: 20px; animation: fade .2s; }
.modal { width: min(1100px, 100%); aspect-ratio: 16 / 9; max-height: 100%; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg); background: #000; position: relative; }
.modal iframe { border: 0; width: 100%; height: 100%; }
.modal .x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; background: rgb(255 255 255 / .9); display: grid; place-items: center; z-index: 2; }
.prog { height: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; display: flex; }
.prog i { display: block; height: 100%; background: var(--ok); }
.prog i.b { background: var(--brand); }
.prog i.w { background: #fbbf24; }
.typebar { display: grid; grid-template-columns: 130px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
.compose { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.phone-prev { border-radius: 30px; background: linear-gradient(160deg, var(--brand), var(--brand-deep)); padding: 18px 14px; color: #fff; min-height: 320px; }
.phone-prev .toast { position: static; animation: none; margin-top: 8px; }
.segl { display: flex; flex-wrap: wrap; gap: 6px; }
.rulecard { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-2); }
.rulecard:first-child { border-top: 0; }
.rulecard .ti { width: 38px; height: 38px; border-radius: 12px; background: var(--brand-deep); color: var(--ball); display: grid; place-items: center; }
.rulecard .val { font: 700 13px var(--f-score); background: var(--line-2); padding: 6px 10px; border-radius: 9px; white-space: nowrap; }
.bracket { display: grid; grid-template-columns: repeat(3, minmax(170px, 1fr)); gap: 14px; align-items: center; overflow-x: auto; }
.bracket .rd { display: flex; flex-direction: column; gap: 10px; justify-content: space-around; height: 100%; }
.bm { border-radius: 14px; border: 1px solid var(--line); background: #fff; padding: 8px 10px; font-size: 12.5px; }
.bm .bt { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.bm .bt.w b { color: var(--brand); }
.bm .bt.l { color: var(--faint); }
.bm .bt .tiles { margin-left: auto; }
.bm.live { border: 2px solid var(--ball); }
.integ { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.integ .it { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: #fff; }
@media (max-width: 1080px) {
  .pn { grid-template-columns: 74px 1fr; }
  .side { padding: 14px 8px; align-items: center; }
  .side .logo .wm, .side .club, .nv span.lb, .side .who div, .nv .badge { display: none; }
  .side .logo { padding: 4px 0 14px; }
  .nv { justify-content: center; padding: 11px; }
  .nv .badgeDot { display: block; }
  .two, .compose { grid-template-columns: 1fr; }
  .ph .srch input { width: 180px; }
  .content { padding: 4px 14px 40px; }
  .ph { padding: 14px 14px 10px; }
}
.nv .badgeDot { display: none; position: absolute; top: 7px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--ball); border: 2px solid var(--brand-deep); }
@media (max-width: 760px) {
  .ph .srch { display: none; }
  .ph h1 { font-size: 26px; }
}
.toasts { top: 14px; left: auto; right: 16px; transform: none; }
</style>
</head>
<body>
<div class="pn" id="root"></div>
<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="assets/core.js" data-frame="panel"></script>
<script>
(function () {
'use strict';
const ic = PC.ic, esc = PC.esc;
const T = (o) => (o == null ? '' : typeof o === 'string' ? o : o.es);
let S = PC.S;
const ui = { sec: 'hoy', sub: { liga: 'grupos', escuela: 'horario' }, drawer: null, modal: null, week: '2026-11-16', comp: { seg: 'escuela-familias', tpl: 'pista' }, phasePreview: false, newLog: null, search: '', bracket: null };
let cueIds = [];
let seenClub = new Set(S.notifs.filter((n) => n.to === 'club').map((n) => n.id));
const brand = () => PC.brand();
const fD = (s) => { const keep = S.lang; S.lang = 'es'; const r = PC.fDay(s); S.lang = keep; return r; };
const fDL = (s) => { const keep = S.lang; S.lang = 'es'; const r = PC.fDay(s, false); S.lang = keep; return r; };
const fLong = (s) => { const keep = S.lang; S.lang = 'es'; const r = PC.fLong(s); S.lang = keep; return r; };
const fAgo = (s) => { const keep = S.lang; S.lang = 'es'; const r = PC.fAgo(s); S.lang = keep; return r; };
function toast(title, body, icon = 'check') {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="ti">${ic(icon, 18)}</div><div><div class="tapp">Panel · ahora</div><b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}</div>`;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 4500);
  setTimeout(() => el.remove(), 5000);
}
const post = (msg) => { try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {} };

/* ---------- datos derivados ---------- */
function queue() {
  const items = [];
  S.changes.filter((c) => c.st === 'accepted').forEach((c) => items.push({ k: 'change', c, m: PC.match(c.m), hot: true }));
  S.subs.filter((s) => s.st === 'pending').forEach((s) => items.push({ k: 'sub', s, m: PC.match(s.m), hot: true }));
  S.disputes.filter((d) => d.st === 'open').forEach((d) => items.push({ k: 'dispute', d, m: PC.match(d.m) }));
  S.inscr.filter((i) => i.st === 'new').forEach((i) => items.push({ k: 'inscr', i }));
  const wed = PC.group('gr-wed1730');
  const wk = S.wait.filter((w) => w.kind === 'kids');
  if (PC.groupStudents(wed.id).length < wed.cap && wk.length) items.push({ k: 'wait', g: wed, w: wk });
  return items;
}
const waiting = () => S.changes.filter((c) => c.st === 'proposed');
function weekMatches(from) { const to = PC.addDays(from + 'T00:00', 7).slice(0, 10); return S.matches.filter((m) => m.at >= from && m.at < to); }

/* ---------- secciones ---------- */
const NAV = [
  ['hoy', 'home', 'Hoy'], ['liga', 'trophy', 'Liga'], ['escuela', 'school', 'Escuela'], ['cobros', 'euro', 'Cobros'], ['socios', 'card', 'Socios'],
  ['com', 'send', 'Comunicación'], ['act', 'star', 'Actividades'], ['docs', 'doc', 'Documentos'], ['ajustes', 'gear', 'Ajustes'],
];
function side() {
  const q = queue().length;
  return `<aside class="side">${PC.logo()}<div class="club">Panel del club</div>
  ${NAV.map(([id, icn, lab]) => `<button class="nv ${ui.sec === id ? 'on' : ''}" data-a="sec" data-v="${id}" data-cue="nav-${id}" title="${lab}">${ic(icn, 19)}<span class="lb">${lab}</span>${id === 'hoy' && q ? `<span class="badge">${q}</span><span class="badgeDot"></span>` : ''}</button>`).join('')}
  <div class="sep"></div>
  <button class="nv" data-a="tv" data-cue="btn-tv" title="Pantalla del club">${ic('tv', 19)}<span class="lb">Pantalla del club</span></button>
  <div class="who"><span class="avatar">SA</span><div><b style="font-size:13px">Sergio</b><small>Gestión deportiva · admin</small></div></div></aside>`;
}
function header(title, extra = '') {
  return `<header class="ph"><div><h1>${title}</h1><div class="date">Martes 17 de noviembre de 2026 · ${PC.time(PC.nowIso())} · ${esc(brand().leagueLong)}</div></div>${extra}<div class="srch">${ic('search', 17)}<input class="input" placeholder="Buscar jugador, equipo o alumno" data-a="search" value="${esc(ui.search)}"></div></header>`;
}
const tabs2 = (key, items) => `<div class="tabs2">${items.map(([id, lab, n]) => `<button class="chip ${ui.sub[key] === id ? 'on' : ''}" data-a="sub" data-k="${key}" data-v="${id}" data-cue="sub-${key}-${id}">${lab}${n ? ` <span class="badge" style="margin-left:2px">${n}</span>` : ''}</button>`).join('')}</div>`;
const card = (title, body, right = '', cls = '') => `<section class="panelc ${cls}"><div class="hd"><h2>${title}</h2><div class="r">${right}</div></div><div class="bd">${body}</div></section>`;

/* ----- hoy ----- */
function secHoy() {
  const q = queue();
  const wm = weekMatches('2026-11-16');
  const today = S.groups.filter((g) => g.dow === 2);
  const t1p = S.pay.filter((r) => r.t === 'T1' && r.st === 'pending');
  const att = Object.values(S.students).reduce((t, s) => t + s.att, 0) / Object.values(S.students).length;
  const val = S.changes.filter((c) => c.st === 'validated').length;
  const k = `<div class="kpis">
    <div class="kpi hot" data-cue="kpi-queue"><div class="k">Necesitan tu OK</div><div class="v">${q.length}</div><div class="s">${waiting().length ? waiting().length + ' cambio esperando al rival' : 'todo lo demás va solo'}</div></div>
    <div class="kpi"><div class="k">Liga esta semana</div><div class="v">${wm.length}</div><div class="s">${wm.filter((m) => m.st === 'played').length} jugados · ${wm.filter((m) => m.resultDue || m.st === 'awaiting').length} resultado pendiente</div></div>
    <div class="kpi"><div class="k">Clases hoy</div><div class="v">${today.length}</div><div class="s">${today.reduce((t, g) => t + PC.occupancy(g.id, PC.TODAY + 'T' + g.time), 0)} alumnos · 1 recuperación</div></div>
    <div class="kpi"><div class="k">Cobros pendientes</div><div class="v">${t1p.length}</div><div class="s">${PC.eur(t1p.reduce((t, r) => t + r.amount, 0))} · recordatorio automático</div></div>
    <div class="kpi"><div class="k">Asistencia escuela</div><div class="v">${Math.round(att * 100)}%</div><div class="s">1 alumno con 3 faltas seguidas</div></div>
    <div class="kpi"><div class="k">Cambios esta fase</div><div class="v">${val}</div><div class="s">0 llamadas · 0 WhatsApps al club</div></div></div>`;
  const qhtml = q.length ? q.map(qItem).join('') : `<div class="empty" style="padding:30px 10px;text-align:center;color:var(--muted)">${ic('check', 28)}<div style="margin-top:8px;font-weight:600">Nada pendiente</div><div style="font-size:12.5px">Los capitanes se organizan solos; aquí solo llega lo que ya está acordado.</div></div>`;
  const wait = waiting().map((c) => { const m = PC.match(c.m); return `<div class="q" style="background:#fafbfe"><div class="qt"><div class="qi" style="background:var(--line-2);color:var(--muted)">${ic('clock', 18)}</div><div class="grow"><b class="t">Esperando al rival · no necesitas hacer nada</b><div class="sub">${esc(PC.team(c.by).name)} ofrece ${c.opts.length} horarios a ${esc(PC.team(PC.vs(m, c.by)).name)} para su partido del ${fDL(m.at)} ${PC.time(m.at)}. Cuando elijan, aparecerá aquí para validar.</div></div></div></div>`; }).join('');
  return `${header('Hoy')}<div class="content">${k}
  <div class="two"><div class="col" style="gap:16px">${card('Necesita tu OK', qhtml + (wait ? `<div style="margin-top:10px">${wait}</div>` : ''), `<span class="pill ${q.length ? 'ball' : 'ok'}">${q.length}</span>`)}</div>

function gantt() {
  const start = 9 * 60, end = 22.5 * 60, span = end - start;
  const x = (hm) => { const [h, m] = hm.split(':').map(Number); return ((h * 60 + m - start) / span) * 100; };
  const blocks = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  S.matches.filter((m) => m.at.slice(0, 10) === PC.TODAY).forEach((m) => blocks[m.court] && blocks[m.court].push({ cls: 'liga', from: PC.time(m.at), dur: 90, t: `${PC.team(m.a).name} – ${PC.team(m.b).name}`, s: `Liga · G${m.g}` }));
  S.groups.filter((g) => g.dow === 2).forEach((g) => blocks[g.court].push({ cls: 'esc', from: g.time, dur: 60, t: `${g.lvl} · ${PC.coach(g.coach).short}`, s: `Escuela ${PC.occupancy(g.id, PC.TODAY + 'T' + g.time)}/${g.cap}` }));
  const R = PC.rng(1711);
  for (let c = 1; c <= 5; c++) {
    let t = 9.5 * 60;
    while (t < 22 * 60) {
      const hm = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
      const busy = blocks[c].some((b) => { const b0 = x(b.from) / 100 * span + start; return t < b0 + b.dur && b0 < t + 90; });
      if (!busy && R() < 0.62) { blocks[c].push({ cls: 'pt', from: hm, dur: 90, t: 'Reserva', s: 'Playtomic' }); t += 90; } else t += 30;
    }
  }
  const hrs = [];
  for (let h = 9; h <= 22; h += 2) hrs.push(h);
  const nowX = x(PC.time(PC.nowIso()));
  return `<div class="gantt"><div class="hrs" style="grid-template-columns:repeat(${hrs.length},1fr)">${hrs.map((h) => `<span>${h}:00</span>`).join('')}</div>
    <div style="position:relative">${[1, 2, 3, 4, 5].map((c) => `<div class="lane"><span>Pista ${c}</span><div class="track">${blocks[c].map((b) => `<div class="blk ${b.cls}" style="left:${x(b.from)}%;width:${(b.dur / span) * 100}%" title="${esc(b.t)}">${esc(b.t)}<small style="opacity:.75;font-weight:500">${esc(b.s)}</small></div>`).join('')}</div></div>`).join('')}
    <div class="nowl" style="left:calc(56px + (100% - 56px) * ${nowX / 100})"></div></div>
    <div class="zone-legend" style="margin-top:10px"><span><i style="background:var(--brand)"></i>Liga</span><span><i style="background:var(--ball)"></i>Escuela</span><span><i style="background:#e8edf5;border:1px solid #dfe5ef"></i>Reservas de Playtomic (solo lectura)</span></div></div>`;
}

  const b = bracketData();
  return `${header('Actividades')}<div class="content"><div class="two">${card('Calendario de actividades', S.events.map((e) => `<div class="q"><div class="qt"><div class="qi">${ic(e.where === 'playtomic' ? 'court' : 'star', 18)}</div><div class="grow"><b class="t">${esc(e.name)}</b><div class="sub">${fLong(e.when)} · ${PC.time(e.when)} · nivel ${esc(e.lvl)}</div></div>${e.where === 'playtomic' ? `<span class="pill">en Playtomic</span>` : e.soon ? '<span class="pill">junio</span>' : `<span class="pill ${e.n >= e.cap ? 'bad' : 'ok'}">${e.n}/${e.cap}</span>`}</div>${e.where === 'app' && !e.soon ? `<div class="prog" style="margin-top:10px"><i class="b" style="width:${(e.n / e.cap) * 100}%"></i></div><div class="muted" style="font-size:12px;margin-top:6px">Inscripción y pago desde la app · prioridad para socios hasta el viernes${e.joined && e.joined.length ? ' · nuevos: ' + e.joined.map((p) => PC.PERSONAS[p].name).join(', ') : ''}</div>` : ''}</div>`).join(''))}
  ${card('Torneo social de Navidad · mesa de control', `<p class="muted" style="margin-bottom:12px">La misma mesa de control que usamos en la app de la DOSS Pádel Cup: un toque para empezar, otro para cerrar, y el ganador pasa solo de ronda.</p><div class="bracket"><div class="rd"><div class="eyebrow">Cuartos</div>${b.qf.map((m, i) => bm(m, i, 'qf')).join('')}</div><div class="rd"><div class="eyebrow">Semifinales</div>${b.sf.map((m, i) => bm(m, i, 'sf')).join('')}</div><div class="rd"><div class="eyebrow">Final</div>${b.f.map((m, i) => bm(m, i, 'f')).join('')}</div></div>`)}</div></div>`;
}

/* ----- documentos ----- */
function secDocs() {
  return `${header('Documentos')}<div class="content">${card('Firmas y consentimientos', `<div class="tbw"><table class="tb"><thead><tr><th>Documento</th><th>Para</th><th>Firmado</th><th></th></tr></thead><tbody>${S.docs.map((d) => `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.who)}</td><td><div class="row" style="gap:8px"><div class="prog" style="width:110px"><i style="width:${(d.ok / d.of) * 100}%"></i></div><span class="mono" style="font-size:12px">${d.ok}/${d.of}</span></div></td><td>${d.ok < d.of ? `<button class="btn btn-ghost btn-sm" data-a="askSign" data-id="${d.id}">Pedir firma a ${d.of - d.ok}</button>` : '<span class="pill ok">Completo</span>'}</td></tr>`).join('')}</tbody></table></div>`)}
  ${card('Lo que ve cada uno', `<div class="integ"><div class="it"><b>Información médica de menores</b><p class="muted" style="font-size:12.5px;margin-top:4px">La familia la escribe una vez. Solo la ve su entrenador, en la lista de clase. Nadie más.</p></div><div class="it"><b>Recogida autorizada</b><p class="muted" style="font-size:12.5px;margin-top:4px">Quién puede llevarse a cada peque, visible en recepción y para el entrenador.</p></div><div class="it"><b>Normativa de la liga</b><p class="muted" style="font-size:12.5px;margin-top:4px">Se acepta al inscribir el equipo; queda registrada la fecha y la versión.</p></div></div>`)}</div>`;
}

/* ----- ajustes ----- */
function secAjustes() {
  const R = PC.RULES;
  const rules = [
    ['trophy', 'Puntos', 'Victoria, empate, derrota, no presentado', `${R.pts.W} · ${R.pts.T} · ${R.pts.L} · ${R.pts.NP}`],
    ['timer', 'Duración y punto de oro', 'El resultado es el del final del tiempo', `${R.minutes}′ · sí`],
    ['clock', 'Últimos minutos', 'Pacto previo entre capitanes', `< ${R.lastMinutes}′ · STB 11 / 3er set`],
    ['cal', 'Días de liga', 'Miércoles y jueves para clientes', 'L M V S D'],
    ['swap', 'Cambios por partido', 'Con fecha alternativa acordada', `${R.changesPerMatch}`],
    ['court', 'Pistas de liga por franja', 'Protege las reservas del resto', `máx. ${R.maxLeagueCourts} de ${R.courts}`],
    ['sub', 'Sustitutos', 'Con aprobación del club', R.subLevel],
    ['alert', 'No presentados', 'En la misma fase', `${R.npLimit} → fuera de la siguiente`],
    ['up', 'Ascensos y descensos', 'Por grupo y fase', `${R.upDown} y ${R.upDown}`],
    ['ball', 'Plazo para el resultado', 'Después, aviso a los capitanes', `${R.resultHours} h`],
  ];
  return `${header('Ajustes')}<div class="content"><div class="two">
  ${card('Vuestra normativa, convertida en reglas', rules.map(([i, t, d, v]) => `<div class="rulecard"><div class="ti">${ic(i, 18)}</div><div><b>${t}</b><div class="muted" style="font-size:12.5px">${d}</div></div><span class="val">${esc(v)}</span></div>`).join(''), `<span class="pill ok">la app las hace cumplir</span>`)}
  <div class="col" style="gap:16px">
  ${card('Imagen del club', `<div class="row wrap" style="gap:10px"><button class="btn ${S.brand === 'doss' ? 'btn-dark' : 'btn-ghost'}" data-a="brand" data-v="doss" data-cue="brand-doss">DOSS Pádel</button><button class="btn ${S.brand === 'oarso' ? 'btn-dark' : 'btn-ghost'}" data-a="brand" data-v="oarso" data-cue="brand-oarso">Padel Indoor Oarso</button></div><p class="muted" style="font-size:12.5px;margin-top:8px">Colores, tipografía, nombre de la liga y de la escuela. Cambia en el móvil y en el panel a la vez.</p>`)}
  ${card('Conexiones', `<div class="integ"><div class="it"><b>Playtomic</b><p class="muted" style="font-size:12.5px;margin-top:4px">Reservas y pozos siguen allí. La app enlaza directamente. La lectura de reservas en el panel depende del acceso que dé Playtomic.</p></div><div class="it"><b>Pagos</b><p class="muted" style="font-size:12.5px;margin-top:4px">Bizum y tarjeta por TPV del banco, remesas SEPA y facturas con TicketBAI.</p></div><div class="it"><b>Idiomas</b><p class="muted" style="font-size:12.5px;margin-top:4px">Castellano y euskera en toda la app y en los avisos.</p></div></div>`)}
  ${card('Quién entra al panel', [['Sergio', 'Administración'], ['Iván', 'Administración'], ['Recepción', 'Cobros, socios y avisos'], ['Entrenadores', 'Solo sus grupos, desde el móvil']].map(([n, r]) => `<div class="row" style="padding:7px 0;border-top:1px solid var(--line-2)"><span class="avatar sm">${PC.ini(n)}</span><b class="grow">${n}</b><span class="muted" style="font-size:12.5px">${r}</span></div>`).join('') + `<div class="checks" style="margin-top:10px">${checkRow(true, 'Servidores en la UE')}${checkRow(true, 'Copia de seguridad diaria')}${checkRow(true, 'Registro de quién cambia qué')}${checkRow(true, 'RGPD y datos de menores')}</div>`)}
  </div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  S = PC.S;
  PC.applyBrand();
  const root = document.getElementById('root');
  const old = root.querySelector('.content');
  const sc = old ? old.scrollTop : 0;
  const map = { hoy: secHoy, liga: secLiga, escuela: secEscuela, cobros: secCobros, socios: secSocios, com: secCom, act: secAct, docs: secDocs, ajustes: secAjustes };
  root.innerHTML = side() + `<div class="mainp">${(map[ui.sec] || secHoy)()}</div>`;
  const nc = root.querySelector('.content');
  if (nc && !ui.resetScroll) nc.scrollTop = sc;
  ui.resetScroll = false;
  const layer = document.getElementById('layer');
  layer.innerHTML = ui.drawer ? groupDrawer(ui.drawer) : ui.modal === 'tv' ? `<div class="modal-bg" data-a="closeLayer" data-self="1"><div class="modal"><button class="x" data-a="closeLayer">${ic('x', 18)}</button><iframe src="tv.html?embed=1" title="Pantalla del club"></iframe></div></div>` : '';
  applyCue();
  post({ t: 'ui', frame: 'panel', sec: ui.sec, sub: ui.sub, modal: ui.modal });
}
function applyCue() {
  document.querySelectorAll('.cue').forEach((e) => e.classList.remove('cue'));
  if (!cueIds.length) return;
  for (let i = cueIds.length - 1; i >= 0; i--) {
    const el = document.querySelector(`[data-cue="${cueIds[i]}"]`);
    if (el) { el.classList.add('cue'); try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} break; }
  }
}
const commit = (w) => { PC.commit(w); ui.newLog = S.log[0] && S.log[0].id; };

const A = {
  sec: (d) => { ui.sec = d.v; ui.resetScroll = true; ui.drawer = null; render(); },
  sub: (d) => { ui.sub[d.k] = d.v; ui.resetScroll = true; render(); },
  validate: (d) => { const c = S.changes.find((x) => x.id === d.id); PC.validateChange(d.id, +d.court); commit('validate'); render(); toast('Cambio validado', 'Calendario actualizado y aviso enviado a los 4 jugadores.', 'check'); },
  reject: (d) => { PC.rejectChange(d.id, 'No hay pista disponible en esa franja'); commit('reject'); render(); toast('Cambio rechazado', 'Los capitanes reciben el motivo al momento.', 'x'); },
  approveSub: (d) => { PC.resolveSub(d.id, true); commit('sub'); render(); toast('Sustituto aprobado', 'El capitán ya lo ve en la ficha del partido.', 'check'); },
  rejectSub: (d) => { PC.resolveSub(d.id, false); commit('sub'); render(); },
  dispute: (d) => { PC.resolveDispute(d.id, d.v); commit('dispute'); render(); toast('Resultado cerrado', 'Clasificación del grupo recalculada.', 'trophy'); },
  inscr: (d) => { const i = S.inscr.find((x) => x.id === d.id); i.st = 'done'; PC.log(`${i.team} asignado al Grupo 6 para la Fase II · bienvenida enviada`, 'liga', 'users'); commit('inscr'); render(); toast('Equipo asignado', 'Les llega la bienvenida con la normativa para aceptar.', 'users'); },
  offerSpot: (d) => { const w = S.wait.find((x) => x.id === d.id); S.wait = S.wait.filter((x) => x.id !== d.id); const g = S.groups.find((x) => x.kind === w.kind && x.lvl === w.lvl && PC.groupStudents(x.id).length < x.cap); if (g) { const sid = 's-w' + w.id; S.students[sid] = { id: sid, name: w.name, socio: false, group: g.id, age: w.age || null, sepa: false, att: 1 }; } PC.log(`Plaza ofrecida a ${w.name}${g ? ` en ${g.lvl} (${['', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][g.dow]} ${g.time})` : ''} · tiene 48 h para aceptarla desde el móvil`, 'escuela', 'school'); commit('wait'); render(); toast('Plaza ofrecida', `${w.name} la recibe en el móvil y la confirma con un toque.`, 'school'); },
  week: (d) => { ui.week = PC.addDays(ui.week + 'T00:00', +d.d).slice(0, 10); render(); },
  remindCaps: () => toast('Recordatorio enviado', 'A los dos capitanes, con el botón para introducir el resultado.', 'bell'),
  phasePreview: () => { ui.phasePreview = true; render(); },
  publishPhase: () => { PC.publishPhase2(); commit('phase'); render(); toast('Borrador de la Fase II publicado', 'Cada equipo ve si sube, baja o se queda, y confirma si sigue.', 'trophy'); },
  group: (d) => { ui.drawer = d.id; render(); },
  closeLayer: (d, el, ev) => { if (d.self && ev.target !== el) return; ui.drawer = null; ui.modal = null; render(); },
  sendT2: () => { PC.sendT2(); commit('t2'); render(); toast('Recibos generados', 'Las familias con enlace ya pueden pagar; el resto se domicilia el 13 de enero.', 'euro'); },
  sepa: () => { const t2 = S.pay.filter((r) => r.t === 'T2' && r.st === 'sepa'); const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<!-- Demo: remesa SEPA ficticia (pain.008) generada por la demo de Ondora Studio -->\n<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.008.001.02"><CstmrDrctDbtInitn><GrpHdr><MsgId>ESCUELA-T2-2027</MsgId><NbOfTxs>${t2.length}</NbOfTxs><CtrlSum>${t2.reduce((t, r) => t + r.amount, 0)}.00</CtrlSum></GrpHdr></CstmrDrctDbtInitn></Document>`; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([xml], { type: 'application/xml' })); a.download = 'remesa-escuela-T2-demo.xml'; document.body.appendChild(a); a.click(); a.remove(); toast('Remesa generada', `${t2.length} recibos listos para subir a la banca online.`, 'download'); },
  remind: (d) => { PC.remind(d.id); commit('remind'); render(); toast('Recordatorio enviado', '', 'bell'); },
  cash: (d) => { PC.payReceipt(d.id, 'efectivo en recepción'); commit('pay'); render(); },
  seg: (d) => { ui.comp.seg = d.v; render(); },
  tpl: (d) => { ui.comp.tpl = d.v; const t = PC.TEMPLATES.find((x) => x.id === d.v); if (t) ui.comp.seg = t.seg; render(); },
  sendMsg: () => { const title = { es: document.getElementById('tes').value, eu: document.getElementById('teu').value }; const body = { es: document.getElementById('bes').value, eu: document.getElementById('beu').value }; PC.sendMessage(ui.comp.seg, title, body); commit('msg'); render(); const sg = PC.SEGMENTS.find((s) => s.id === ui.comp.seg); toast('Aviso enviado', `${sg.n} personas · cada una en su idioma.`, 'send'); },
  bstart: (d) => { const b = bracketData(); b.qf[+d.i].live = true; render(); },
  bfin: (d) => { const b = bracketData(); const m = b.qf[+d.i]; m.live = false; m.s = [[6, 4], [6, 3]]; m.w = 'a'; const sf = b.sf[Math.floor(+d.i / 2)]; if (+d.i % 2 === 0) sf.a = m.a; else sf.b = m.a; render(); toast(`${m.a} pasa a semifinales`, 'Aviso automático a todos los inscritos, como en la DOSS Pádel Cup.', 'trophy'); },
  askSign: (d) => { const doc = S.docs.find((x) => x.id === d.id); toast('Petición enviada', `${doc.of - doc.ok} personas reciben el documento para firmar en el móvil.`, 'doc'); },
  brand: (d) => { S.brand = d.v; commit('brand'); render(); },
  tv: () => { ui.modal = 'tv'; render(); },
  noop: () => toast('Disponible en la versión real', '', 'info'),
  search: () => {},
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') return;
  ev.preventDefault();
  fn(el.dataset, el, ev);
});
function checkClub() {
  S.notifs.filter((n) => n.to === 'club').forEach((n) => { if (!seenClub.has(n.id)) { seenClub.add(n.id); toast(T(n.title), T(n.body), { change: 'swap', sub: 'sub', pay: 'euro' }[n.kind] || 'bell'); } });
}
PC.on((what, local) => {
  if (what && typeof what === 'object') {
    if (what.t === 'cue' && (what.frame === 'panel' || !what.frame)) { cueIds = what.ids || []; applyCue(); }
    if (what.t === 'nav' && what.frame === 'panel') applyNav(what);
    return;
  }
  if (what === 'reset') { location.reload(); return; }
  S = PC.S;
  if (!local) { ui.newLog = S.log[0] && S.log[0].id; render(); checkClub(); }
});
function applyNav(n) { if (n.sec) { ui.sec = n.sec; ui.resetScroll = true; } if (n.sub) ui.sub[n.sec] = n.sub; if ('modal' in n) ui.modal = n.modal; ui.drawer = null; render(); }
window.addEventListener('message', (e) => { const m = e.data || {}; if (m.t === 'cue' && (m.frame === 'panel' || !m.frame)) { cueIds = m.ids || []; applyCue(); } if (m.t === 'nav' && m.frame === 'panel') applyNav(m); });
setInterval(() => { if (ui.sec === 'hoy' && !document.querySelector('.drawer-bg, .modal-bg, input:focus, textarea:focus')) render(); }, 60000);
render();
})();
</script>
</body>
</html>
